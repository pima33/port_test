name: iOS signed IPA
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Registered Apple Bundle ID
        required: true
        type: string
      team_id:
        description: Apple Developer Team ID
        required: true
        type: string
      method:
        description: Distribution method
        type: choice
        options: [app-store-connect, release-testing]
        default: app-store-connect
      upload_testflight:
        description: Upload App Store build to TestFlight (requires ASC API secrets)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-26
    environment: ios-signing
    timeout-minutes: 25
    env:
      APP_BUNDLE_ID: ${{ inputs.bundle_id }}
      APP_TEAM_ID: ${{ inputs.team_id }}
      EXPORT_METHOD: ${{ inputs.method }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Protocol tests
        run: swift test --package-path ios
      - name: Import signing identity
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64" && test -n "$PROFILE_BASE64"
          KEYCHAIN_PATH="$RUNNER_TEMP/magercam-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/signing.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY'
          import os, plistlib, pathlib, shutil, datetime
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          profile = plistlib.loads((temp / 'profile.plist').read_bytes())
          bundle, team = os.environ['APP_BUNDLE_ID'], os.environ['APP_TEAM_ID']
          assert profile['TeamIdentifier'][0] == team, 'Wrong team in profile'
          assert profile['Entitlements']['application-identifier'].endswith('.' + bundle), 'Wrong Bundle ID in profile'
          assert profile['ExpirationDate'] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None), 'Expired profile'
          assert not profile['Entitlements'].get('get-task-allow', False), 'Use a distribution profile'
          if os.environ['EXPORT_METHOD'] == 'release-testing':
              assert profile.get('ProvisionedDevices'), 'Ad Hoc profile must include your iPhone UDID'
          else:
              assert not profile.get('ProvisionedDevices'), 'App Store export requires an App Store profile'
          for directory in [pathlib.Path.home()/'Library/MobileDevice/Provisioning Profiles', pathlib.Path.home()/'Library/Developer/Xcode/UserData/Provisioning Profiles']:
              directory.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(temp/'profile.mobileprovision', directory/(profile['UUID']+'.mobileprovision'))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('PROFILE_UUID='+profile['UUID']+'\n')
          options = dict(method=os.environ['EXPORT_METHOD'], teamID=team, signingStyle='manual', signingCertificate='Apple Distribution', provisioningProfiles={bundle:profile['UUID']})
          (temp/'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY
      - name: Archive and export
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project ios/MagerCam.xcodeproj -scheme MagerCam -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/MagerCam.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" DEVELOPMENT_TEAM="$APP_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MagerCam.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          shasum -a 256 "$RUNNER_TEMP/export/MagerCam.ipa" > "$RUNNER_TEMP/export/SHA256.txt"
          printf 'Source: %s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/export/BUILD.txt"
          xcodebuild -version >> "$RUNNER_TEMP/export/BUILD.txt"
      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MagerCam-signed-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/export/SHA256.txt
            ${{ runner.temp }}/export/BUILD.txt
            ${{ runner.temp }}/MagerCam.xcarchive/dSYMs
          retention-days: 7
      - name: Upload to App Store Connect
        if: inputs.upload_testflight && inputs.method == 'app-store-connect'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_PRIVATE_KEY_BASE64"
          mkdir -p "$RUNNER_TEMP/asc/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/private_keys/AuthKey_$ASC_KEY_ID.p8"
          cd "$RUNNER_TEMP/asc"
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/export/MagerCam.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove temporary signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/magercam-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [ -d "$RUNNER_TEMP/asc/private_keys" ]; then
            find "$RUNNER_TEMP/asc/private_keys" -type f -name '*.p8' -delete
          fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
